<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Hooney (Seolhun), founder of Firstage and product engineer</title>
  <desc id="d">A terminal window: whoami prints the founder role, ls lists the products Firstage, Social Finder, ROUND and TacticFrame, and uptime prints shipping software since 2016 in Seoul.</desc>
  <rect x="1" y="1" width="1198" height="398" rx="18" fill="#FBFAF8" stroke="#E5E0D8" stroke-width="2" />
  <path d="M1 19 A18 18 0 0 1 19 1 H1181 A18 18 0 0 1 1199 19 V52 H1 Z" fill="#F0EDE8" />
  <circle cx="34" cy="27" r="7" fill="#FF5F57" /><circle cx="58" cy="27" r="7" fill="#FEBC2E" /><circle cx="82" cy="27" r="7" fill="#28C840" />
  <text x="600" y="33" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#6E6862">hooney@firstage: ~</text>
  <g font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="27">
    <text x="48" y="108"><tspan fill="#D9443C">❯</tspan><tspan fill="#1F1D1B" dx="14">whoami</tspan></text>
    <text x="48" y="150" fill="#1F1D1B" font-weight="700">Hooney (Seolhun)<tspan fill="#6E6862" font-weight="400">, founder of </tspan><tspan fill="#D9443C" font-weight="700">Firstage</tspan><tspan fill="#6E6862" font-weight="400">, product engineer</tspan></text>
    <text x="48" y="212"><tspan fill="#D9443C">❯</tspan><tspan fill="#1F1D1B" dx="14">ls ~/products</tspan></text>
    <text x="48" y="254" fill="#0E7490">firstage/<tspan dx="34">social-finder/</tspan><tspan dx="34">round/</tspan><tspan dx="34">tacticframe/</tspan></text>
    <text x="48" y="316"><tspan fill="#D9443C">❯</tspan><tspan fill="#1F1D1B" dx="14">uptime</tspan></text>
    <text x="48" y="358" fill="#6E6862">shipping software since 2016, Seoul</text>
  </g>
  <rect x="660" y="333" width="15" height="30" fill="#D9443C"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite" /></rect>
</svg>
